<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ensino Plus Concursos — Sala de Estudos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'], mono: ['"JetBrains Mono"', 'monospace'] } } }
    };
    // Aplica o tema salvo antes de desenhar a página (evita "piscar")
    try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
  </script>
  <style>
    .riscada { text-decoration: line-through; opacity: .4; }
    .folha-pautada { background-image: repeating-linear-gradient(transparent, transparent 31px, #cbd5e1 31px, #cbd5e1 32px); line-height: 32px; }
    .dark .folha-pautada { background-image: repeating-linear-gradient(transparent, transparent 31px, #1e293b 31px, #1e293b 32px); }
    .marca-alerta { background: #fecdd3; color: #881337; padding: 0 3px; border-radius: 4px; font-weight: 700; }
    .marca-excecao { background: #fef08a; color: #713f12; padding: 0 3px; border-radius: 4px; font-weight: 700; }
    .marca-numero { background: #c7d2fe; color: #312e81; padding: 0 3px; border-radius: 4px; font-weight: 700; }
    .dark .marca-alerta { background: #4c0519; color: #fecdd3; }
    .dark .marca-excecao { background: #713f12; color: #fef08a; }
    .dark .marca-numero { background: #312e81; color: #c7d2fe; }
  </style>
</head>
<body class="bg-[#eaedf2] dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 font-sans min-h-screen flex flex-col antialiased transition-colors duration-200">

  <!-- CABEÇALHO -->
  <header class="bg-white dark:bg-[#0f1422] border-b border-slate-300 dark:border-slate-800 sticky top-0 z-50 shadow-sm">
    <div class="max-w-[1400px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <button onclick="abrir('inicio')" class="flex items-center gap-2.5 text-left hover:opacity-80 shrink-0">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white text-xs shadow-md shadow-indigo-600/20">EP</div>
        <div class="hidden sm:block">
          <span class="font-bold text-sm text-slate-900 dark:text-white tracking-tight">Ensino Plus</span>
          <span class="text-[10px] block text-indigo-600 dark:text-indigo-400 font-bold -mt-0.5">CONCURSOS</span>
        </div>
      </button>

      <button onclick="abrir('inicio', true)" id="btn-area" class="flex-1 sm:flex-none min-w-0 inline-flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/60 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-900">
        <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
        <span id="label-area" class="truncate">Escolha sua área</span>
        <i data-lucide="chevron-down" class="w-3.5 h-3.5 shrink-0"></i>
      </button>

      <div class="flex items-center gap-2 shrink-0">
        <button onclick="abrir('planos')" title="Planos e preços" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-900 hover:opacity-80"><i data-lucide="crown" class="w-4 h-4"></i><span class="hidden sm:inline">Planos</span></button>
        <div class="hidden md:flex items-center gap-2 bg-slate-200/80 dark:bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700" title="Tempo de estudo nesta sessão">
          <i data-lucide="timer" class="w-4 h-4 text-slate-600 dark:text-slate-400"></i>
          <span class="font-mono text-xs font-bold" id="cronometro">00:00:00</span>
          <button onclick="alternarCronometro()" id="btn-cronometro" class="text-[10px] uppercase font-bold text-indigo-600 dark:text-indigo-400 ml-1">Pausar</button>
        </div>
        <button onclick="alternarTema()" title="Alternar modo claro e escuro" class="p-2 rounded-xl bg-slate-200/80 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-amber-400 hover:bg-slate-300 dark:hover:bg-slate-700">
          <i data-lucide="moon" id="icone-tema" class="w-4 h-4"></i>
        </button>
        <div id="usuario-area" class="flex items-center gap-2"></div>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO -->
  <main class="flex-1 max-w-[1400px] w-full mx-auto px-4 sm:px-6 py-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <section id="painel" class="lg:col-span-8 space-y-4 min-w-0"></section>
      <aside id="lateral" class="lg:col-span-4 space-y-4 min-w-0"></aside>
    </div>
  </main>

  <footer id="rodape" class="text-center text-[11px] text-slate-500 dark:text-slate-500 py-6">
    Ensino Plus Concursos • Seu progresso fica salvo na sua conta.
  </footer>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
  <script src="auth.js"></script>
  <script src="perfil.js"></script>
  <script src="planos.js"></script>
  <script src="sync.js"></script>
</body>
</html>
